<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lodestar</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22><g transform=%22rotate(-14 32 32)%22 fill=%22%234a7bb5%22><path d=%22M32 4.5 L36.6 32 L32 59.5 L27.4 32 Z%22/><path d=%22M3 32 L32 36.4 L61 32 L32 27.6 Z%22/></g><circle cx=%2232%22 cy=%2232%22 r=%226%22 fill=%22%234a7bb5%22/></svg>">
  <!-- Every token this page needs is written here rather than pulled from
       styles.css, and the same goes for the script. This is the ONE page a
       stranger can fetch, so it is the one page whose whole content is worth
       reading in a single sitting: no module graph, no stylesheet, nothing
       else that has to be made public to render it. It costs a little
       duplication of four colours and two font stacks. -->
  <style>
    :root {
      --paper: #f5f7f2; --ink: #22303a; --rule-red: #c8574a; --line: #cfd8cf;
      --display: "American Typewriter", "Courier New", "Courier", serif;
      --body: "Avenir Next", "Avenir", "Segoe UI", system-ui, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root { --paper: #20241f; --ink: #e6e4d8; --rule-red: #d07a6c; --line: #3a4038; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: var(--paper); color: var(--ink); font-family: var(--body);
      /* The quad-paper grid the board is drawn on, so the door belongs to the
         same building as the room behind it. */
      background-image:
        linear-gradient(var(--line) 1px, transparent 1px),
        linear-gradient(90deg, var(--line) 1px, transparent 1px);
      background-size: 24px 24px;
    }
    form {
      width: min(22rem, calc(100vw - 2rem)); padding: 1.75rem;
      background: var(--paper); border: 1px solid var(--line);
      border-top: 3px solid var(--rule-red); border-radius: 2px;
      box-shadow: 0 1px 3px rgba(0,0,0,.12);
    }
    h1 { font-family: var(--display); font-size: 1.5rem; margin: 0 0 .25rem; }
    p.sub { margin: 0 0 1.25rem; font-size: .8rem; opacity: .7; }
    label { display: block; font-size: .72rem; letter-spacing: .04em;
            text-transform: uppercase; opacity: .7; margin-bottom: .35rem; }
    input, button {
      width: 100%; font: inherit; padding: .55rem .6rem; border-radius: 2px;
    }
    input { border: 1px solid var(--line); background: transparent; color: inherit; }
    input:focus { outline: 2px solid var(--rule-red); outline-offset: 1px; }
    button {
      margin-top: 1rem; border: none; cursor: pointer;
      background: var(--rule-red); color: #fff; font-family: var(--display);
      letter-spacing: .03em;
    }
    button[disabled] { opacity: .6; cursor: progress; }
    #err { margin: .9rem 0 0; font-size: .8rem; color: var(--rule-red);
           min-height: 1.2em; }
  </style>
</head>
<body>
  <form id="f" method="post" action="/api/login" autocomplete="on">
    <h1>Lodestar</h1>
    <p class="sub">This board is reachable from this machine only. Sign in to open it.</p>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" required autofocus
           autocomplete="current-password">
    <button id="go" type="submit">Open the board</button>
    <p id="err" role="alert"></p>
  </form>
  <script>
    // One fetch, one message. The failure text is whatever the server said and
    // the server says one thing for every failure, so this page cannot become
    // the place that leaks which part went wrong.
    const form = document.getElementById('f');
    const err = document.getElementById('err');
    const go = document.getElementById('go');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      err.textContent = '';
      go.disabled = true;
      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ password: document.getElementById('password').value }),
        });
        if (res.ok) { location.replace('/'); return; }
        const wait = res.headers.get('Retry-After');
        err.textContent = wait
          ? `Too many attempts. Try again in ${wait}s.`
          : 'Login failed.';
      } catch {
        err.textContent = 'The server did not answer.';
      } finally {
        go.disabled = false;
        form.password.value = '';
        form.password.focus();
      }
    });
  </script>
</body>
</html>
