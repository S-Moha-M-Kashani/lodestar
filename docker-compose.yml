name: lodestar

services:
  lodestar:
    build: .
    ports:
      # 127.0.0.1 on the host side, and it is the security boundary of this
      # whole stack. A bare "3000:3000" tells Docker to listen on every
      # interface — so on university Wi-Fi the board answered any peer who
      # knew the laptop's address, and it did so THROUGH the host firewall,
      # since Docker publishes by writing its own nat rules. Every published
      # port below carries the same prefix, and tests/compose.test.js fails on
      # any that does not.
      - "127.0.0.1:3000:3000"
    environment:
      # The one caller of this switch, and the reason it exists. Docker
      # forwards a published port to the CONTAINER's address, so a server that
      # binds 127.0.0.1 inside its own network namespace is reachable by
      # nothing at all — not the host mapping above, not the brain. The
      # loopback boundary therefore moves up one level, to the mapping above.
      # Outside a container this variable puts the board on the Wi-Fi; there is
      # no reason to set it there.
      LODESTAR_BIND: 0.0.0.0
      # Inside the network the brain dials http://lodestar:3000, a name the
      # Host allowlist cannot derive from a port. Exact match, one name.
      LODESTAR_ALLOWED_HOSTS: lodestar:3000
      # No default and no fallback: `docker compose up` stops with this name in
      # the error rather than starting a board anyone on the network can read.
      # Make one with `npm run auth:setup` and put it in .env.
      LODESTAR_AUTH_PASSWORD_HASH: ${LODESTAR_AUTH_PASSWORD_HASH:?run npm run auth:setup and put the printed line in .env}
      # Shared with the brain below, which is the only non-human caller of the
      # board API. Empty means the brain cannot reach the board at all, which
      # is the safe direction to fail in.
      LODESTAR_SERVICE_TOKEN: ${LODESTAR_SERVICE_TOKEN:-}
      # Both records live in databases/real/, the same two files `npm start`
      # opens. They used to differ: BOARD_DB pointed into a Docker-owned volume
      # and ASSISTANT_DB was unset, so the container wrote the board to a
      # private copy and opened the real chat record read-only through the tree
      # mount below. On 2026-08-30 that cost two boards.
      BOARD_DB: /data/board.db
      ASSISTANT_DB: /data/assistant.db
      AGENT_URL: http://brain:9000
    volumes:
      # Writable, unlike the tree mount: this is the one path the container is
      # allowed to write back through, and a database opened through a :ro
      # mount cannot be opened for writing at all.
      - ./databases/real:/data
      # Serve the working tree, not the copy baked in at build time. Without this
      # the container keeps serving the frontend it was built with — the API and
      # the board stay current, so the staleness shows up only as views quietly
      # missing from :3000. The whole tree, not single files: a file bind mount
      # is pinned to an inode, so an editor that saves by rename would silently
      # go stale again. Read-only — the container never writes back over source.
      - .:/app:ro
    restart: unless-stopped

  # The "brain" — agent, web search, and hybrid RAG. Internal only: the browser
  # reaches it through the Node proxy, and the OpenRouter key never leaves it.
  brain:
    build: ./brain
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      BRAIN_MODEL: ${BRAIN_MODEL:-4skl/gemma4-e2b-mtp}
      BRAIN_LLM: ${BRAIN_LLM:-ollama}
      BRAIN_OLLAMA_BASE_URL: ${BRAIN_OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
      # Both backends are named outright because there is no 'auto' mode to fall
      # back on any more. The embedder is the architecture: this one measured
      # 0.617 recall on the Farsi corpus against ~0.01 for the Latin-only
      # alternative, a ~60x gap where every other retrieval knob was worth under
      # 2%. BRAIN_EMBED_MODEL is deliberately left unset — '' already resolves to
      # heydariAI/persian-embeddings. It costs a ~2.2 GB download, paid on the
      # first retrieval rather than at boot: the weights load lazily so /health
      # answers while the container is still cold, which is what keeps a fresh
      # `docker compose up` from looking hung. The image can never install the
      # 'voice' extra, since parakeet-mlx is Apple-Silicon only — hence
      # OpenRouter for dictation. The chat model is the opposite way round:
      # BRAIN_LLM=ollama reaches the daemon on the host, so the composed brain is
      # local-first like the native one.
      # tests/compose.test.js fails if either pin goes missing.
      BRAIN_EMBEDDER: ${BRAIN_EMBEDDER:-sentence-transformers}
      BRAIN_TRANSCRIBER: ${BRAIN_TRANSCRIBER:-openrouter}
      BOARD_API_URL: http://lodestar:3000
      # The board requires a login now, and the brain is not a person. It gets
      # a token rather than the user's password, so the plaintext lives in one
      # head and in no service's environment.
      BOARD_API_TOKEN: ${LODESTAR_SERVICE_TOKEN:-}
      # Chat memory lives on this stack's own chroma service below — one store,
      # shared with a native brain through the published host port. Set
      # BRAIN_CHROMA_URL=memory to run without it (memory is then per-boot).
      BRAIN_CHROMA_URL: ${BRAIN_CHROMA_URL:-http://chroma:8000}
      # Where a search result leads is checked before the model may cite it, and
      # the real backend refuses to boot without a key on purpose. Pinning 'off'
      # here keeps `docker compose up --build` working out of the box for someone
      # who has no Safe Browsing key; set GOOGLE_SAFE_BROWSING_KEY and
      # BRAIN_URL_SAFETY=google-safe-browsing to turn the check on.
      BRAIN_URL_SAFETY: ${BRAIN_URL_SAFETY:-off}
      GOOGLE_SAFE_BROWSING_KEY: ${GOOGLE_SAFE_BROWSING_KEY:-}
      # Tracing is the same shape of decision as the link check above: the *env*
      # default is the real backend, which raises at boot without a key, so
      # compose pins 'off' to keep `docker compose up --build` working for
      # someone who has no LangSmith account. It is also the more careful
      # default for a container — this board holds a private life, and turning
      # it on ships every conversation to a third-party cloud. Set
      # BRAIN_TRACING=langsmith with LANGSMITH_API_KEY to turn it on.
      BRAIN_TRACING: ${BRAIN_TRACING:-off}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      # Start order matters more than usual: a brain that boots first disables
      # chat memory until its next restart.
      - chroma
    volumes:
      # Same reason as the board above: run the working tree, not the copy baked
      # in at build time. Only src/ — the image's virtualenv lives at /app/.venv,
      # and mounting the host's brain/ over /app would swap a Linux venv for the
      # host's macOS one and the service would not start. uv installs the project
      # editable, so lodestar_brain resolves to this mount. Python has no reload
      # here, so a change needs `docker compose restart brain`, not a rebuild.
      - ./brain/src:/app/src:ro
    restart: unless-stopped

  # Chat memory — the project's own Chroma, persisting to
  # databases/real/chroma-data beside the other two real databases. Derived
  # data: chunks and vectors rebuild from assistant.db, which is why the backup
  # covers the .db files and never this folder. A bind mount rather than a
  # named volume so "where is my data" has one answer. Host port 8003:
  # 8001/8002 belong to the unrelated ~/vectordb-lab stack
  # (tests/ports.test.js), and both stacks must be able to run at once.
  # `npm run chroma` starts just this service for native runs.
  chroma:
    # Pinned, not latest: a rebuild must not hand databases/real/chroma-data a
    # Chroma it was not written by. The tag says which release runs — 1.5.9,
    # which is also what `latest` resolves to today, so this pin changes nothing
    # about what starts. The digest is there because Docker Hub tags are
    # mutable: a re-pushed 1.5.9 would otherwise become different bytes with
    # nothing saying so — the same failure one level down. Update deliberately,
    # re-establishing the version from this machine and never from memory or a
    # changelog:
    #   docker buildx imagetools inspect chromadb/chroma:latest \
    #     --format '{{.Manifest.Digest}}'
    # One trap when checking a running container: `chroma --version` inside this
    # image reports 1.4.4 — the Rust crate version, which lags the release tag.
    # It is not the image version and has never been a Docker Hub tag.
    image: chromadb/chroma:1.5.9@sha256:1e0b73a187a28757c572acba508c46f48c9e8b0acaf5c20e6d95cdedce1acdf6
    ports:
      # Loopback on the host side, like every other published port here: a
      # vector store reachable from the Wi-Fi hands out the same private life
      # the board does, one chunk at a time.
      - "127.0.0.1:8003:8000"
    volumes:
      - ./databases/real/chroma-data:/data
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
    restart: unless-stopped

  # The :3001 sandbox's own Chroma — a physically separate store under
  # databases/test/, so test chunks and vectors never share files with real
  # chat memory: "delete the test data" is `rm -rf databases/test` and can
  # never touch the real store. `npm run test-brain` dials it on :8004
  # (tests/ports.test.js pins the pairing); `npm run chroma-test` starts it.
  chroma-test:
    # The same image as the real store, pinned the same way and for the same
    # reason: a twin on another version rehearses nothing.
    image: chromadb/chroma:1.5.9@sha256:1e0b73a187a28757c572acba508c46f48c9e8b0acaf5c20e6d95cdedce1acdf6
    ports:
      - "127.0.0.1:8004:8000"
    volumes:
      - ./databases/test/chroma-data-3001:/data
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
    restart: unless-stopped
