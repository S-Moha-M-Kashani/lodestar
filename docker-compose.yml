name: lodestar

services:
  lodestar:
    build: .
    ports:
      # 127.0.0.1 on the host side, and it is the security boundary of this
      # whole stack. A bare "3000:3000" tells Docker to listen on every
      # interface — so on university Wi-Fi the board answered any peer who
      # knew the laptop's address, and it did so THROUGH the host firewall,
      # since Docker publishes by writing its own nat rules. Every published
      # port below carries the same prefix, and tests/compose.test.js fails on
      # any that does not.
      - "127.0.0.1:3000:3000"
      # The one deliberate exception (2026-09-03): a second person in this house
      # opens the board on her own device over the home Wi-Fi. One literal
      # address, never 0.0.0.0 and never a range — and pinning it is what keeps
      # the exception local, because this laptop travels: on any other network
      # Docker cannot bind an address that is not there, so `docker compose up`
      # fails loudly instead of quietly serving a private life to a cafe. The
      # cost of that safety: the address has to be held fixed on this machine
      # (Wi-Fi -> Details -> TCP/IP -> Using DHCP with manual address), or the
      # board stops starting at home too. The password is still the gate; this
      # only decides who can see the door. Until Tailscale replaces it, note
      # that the login crosses the WPA home network unencrypted.
      - "192.168.0.121:3000:3000"
    environment:
      # The one caller of this switch, and the reason it exists. Docker
      # forwards a published port to the CONTAINER's address, so a server that
      # binds 127.0.0.1 inside its own network namespace is reachable by
      # nothing at all — not the host mapping above, not the brain. The
      # loopback boundary therefore moves up one level, to the mapping above.
      # Outside a container this variable puts the board on the Wi-Fi; there is
      # no reason to set it there.
      LODESTAR_BIND: 0.0.0.0
      # Inside the network the brain dials http://lodestar:3000, a name the
      # Host allowlist cannot derive from a port. Exact match, whole strings.
      # The two home-network spellings are here for the same reason: a browser
      # on another device sends the address it typed, which is not a loopback
      # name, so without them every request from her laptop is a 403 before a
      # row is read. The .local name is Bonjour's and survives the address
      # changing; the literal address is the fallback for a device whose
      # browser will not resolve it.
      #
      # The fourth is the tailnet name (2026-09-12), and it is the cheapest of
      # them: `tailscale serve --bg --https=8443 http://127.0.0.1:3000` takes
      # the call on the private network, terminates TLS with a real
      # certificate and dials the loopback mapping above, so no port is
      # published on it and nothing about the boundary moves. The Host header
      # survives that proxy intact — name AND port, 8443 because 443 on this
      # tailnet belongs to another service here — and the allowlist is
      # exact-match, so this one line is the whole difference between the
      # phone reaching the board and being answered 403 before a row is read.
      LODESTAR_ALLOWED_HOSTS: lodestar:3000,192.168.0.121:3000,mohas-macbook-pro.local:3000,mohas-macbook-pro.tailf01a94.ts.net:8443
      # Both forms of the one credential are passed through, because either is
      # a complete answer: the hash `npm run auth:setup` prints, or the
      # password itself on a line in .env. `:?` used to sit on the hash so
      # compose failed fast, and it could not stay — it refuses a stack whose
      # password is the plaintext, which is now the ordinary way to have one.
      #
      # The refusal moved one layer down rather than going away. `:-` yields an
      # empty string, server.js reads an empty credential as absent and fills
      # what it can from the .env in the mounted tree below, and it stops the
      # process before the databases open if neither form arrived. What must
      # never appear here is a literal: a default password in a tracked file is
      # the state this whole boundary exists to end (tests/compose.test.js).
      LODESTAR_AUTH_PASSWORD_HASH: ${LODESTAR_AUTH_PASSWORD_HASH:-}
      LODESTAR_AUTH_PASSWORD: ${LODESTAR_AUTH_PASSWORD:-}
      # Shared with the brain below, which is the only non-human caller of the
      # board API. Empty means the brain cannot reach the board at all, which
      # is the safe direction to fail in.
      LODESTAR_SERVICE_TOKEN: ${LODESTAR_SERVICE_TOKEN:-}
      # Both records live in databases/real/, the same two files `npm start`
      # opens. They used to differ: BOARD_DB pointed into a Docker-owned volume
      # and ASSISTANT_DB was unset, so the container wrote the board to a
      # private copy and opened the real chat record read-only through the tree
      # mount below. On 2026-08-30 that cost two boards.
      BOARD_DB: /data/board.db
      ASSISTANT_DB: /data/assistant.db
      AGENT_URL: http://brain:9000
    volumes:
      # Writable, unlike the tree mount: this is the one path the container is
      # allowed to write back through, and a database opened through a :ro
      # mount cannot be opened for writing at all.
      - ./databases/real:/data
      # Serve the working tree, not the copy baked in at build time. Without this
      # the container keeps serving the frontend it was built with — the API and
      # the board stay current, so the staleness shows up only as views quietly
      # missing from :3000. The whole tree, not single files: a file bind mount
      # is pinned to an inode, so an editor that saves by rename would silently
      # go stale again. Read-only — the container never writes back over source.
      - .:/app:ro
    restart: unless-stopped

  # The "brain" — agent, web search, and hybrid RAG. Internal only: the browser
  # reaches it through the Node proxy, and the OpenRouter key never leaves it.
  brain:
    build: ./brain
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      BRAIN_MODEL: ${BRAIN_MODEL:-4skl/gemma4-e2b-mtp}
      # The composed brain answers through the Codex subscription by default
      # (2026-09-17). It is the only backend here that needs neither an API key
      # nor a model pulled onto the host: `codex login --device-auth` runs
      # inside this container from the Assistant's settings drawer, and the
      # login it earns lands in the volume below. Ollama is still one variable
      # away (`BRAIN_LLM=ollama`) and still reaches the daemon on the host.
      #
      # The cost, named: a stack built today cannot answer a single turn until
      # that login is done once. The failure is legible — codex says so and the
      # Assistant shows what it said — and the drawer is where it is fixed.
      # tests/compose.test.js refuses any CLI default the image cannot run.
      BRAIN_LLM: ${BRAIN_LLM:-codex-cli}
      BRAIN_OLLAMA_BASE_URL: ${BRAIN_OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
      # Both backends are named outright because there is no 'auto' mode to fall
      # back on any more. The embedder is the architecture: this one measured
      # 0.617 recall on the Farsi corpus against ~0.01 for the Latin-only
      # alternative, a ~60x gap where every other retrieval knob was worth under
      # 2%. BRAIN_EMBED_MODEL is deliberately left unset — '' already resolves to
      # heydariAI/persian-embeddings. It costs a ~2.2 GB download, and with chat
      # memory configured — which is the default below — it is paid at BOOT and
      # not on the first retrieval. `_PrefixedEmbeddings.model` really is a lazy
      # property, but `ChatStore.__init__` asks the embedder for its identity and
      # reads that very property (retrieval/chat.py, `_embedder_identity`), so
      # the deferral is undone one line into the store's constructor — which runs
      # inside `create_app`, at import, before uvicorn has a server process to
      # answer /health with. retrieval/cards.py avoids the same trap on purpose
      # and says so above `embedder_identity`.
      #
      # Measured on this machine 2026-09-08, one image, runs differing only in
      # BRAIN_CHROMA_URL: with chat memory off, /health answered 200 in 6 s and
      # nothing was downloaded at all; with it on, /health refused connections
      # for the whole 120 s the run was watched while the weights were still
      # arriving. So a cold container does not answer /health until the model is
      # present, and the cache mount under `volumes` is what makes that a
      # one-time cost per machine rather than one per container.
      #
      # The image can never install the 'voice' extra, since parakeet-mlx is
      # Apple-Silicon only — hence OpenRouter for dictation. The chat model is
      # the opposite way round:
      # BRAIN_LLM=ollama reaches the daemon on the host, so the composed brain is
      # local-first like the native one.
      # tests/compose.test.js fails if either pin goes missing.
      # Which agent answers a turn. Widget 2 is the only agent, and the default
      # here as it is in the code, so a composed stack and a native one cannot
      # disagree about who answers. Any other name, including the retired one,
      # refuses to boot rather than falling back. It has to be passed through
      # explicitly or the seam is unreachable in the one deployment that is
      # actually used.
      BRAIN_AGENT: ${BRAIN_AGENT:-widget2}
      BRAIN_EMBEDDER: ${BRAIN_EMBEDDER:-sentence-transformers}
      BRAIN_TRANSCRIBER: ${BRAIN_TRANSCRIBER:-openrouter}
      BOARD_API_URL: http://lodestar:3000
      # The board requires a login now, and the brain is not a person. It gets
      # a token rather than the user's password, so the plaintext lives in one
      # head and in no service's environment.
      BOARD_API_TOKEN: ${LODESTAR_SERVICE_TOKEN:-}
      # Chat memory lives on this stack's own chroma service below — one store,
      # shared with a native brain through the published host port. Set
      # BRAIN_CHROMA_URL=memory to run without it (memory is then per-boot).
      BRAIN_CHROMA_URL: ${BRAIN_CHROMA_URL:-http://chroma:8000}
      # The agent does not search the web, so this checker is not consulted at
      # boot. Pinned off so a composed stack does not look as if it were about
      # to require a Safe Browsing key.
      BRAIN_URL_SAFETY: ${BRAIN_URL_SAFETY:-off}
      GOOGLE_SAFE_BROWSING_KEY: ${GOOGLE_SAFE_BROWSING_KEY:-}
      # Tracing is the same shape of decision as the link check above: the *env*
      # default is the real backend, which raises at boot without a key, so
      # compose pins 'off' to keep `docker compose up --build` working for
      # someone who has no LangSmith account. It is also the more careful
      # default for a container — this board holds a private life, and turning
      # it on ships every conversation to a third-party cloud. Set
      # BRAIN_TRACING=langsmith with LANGSMITH_API_KEY to turn it on.
      BRAIN_TRACING: ${BRAIN_TRACING:-off}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      # The Claude subscription, for the half of this pair that has no device
      # login. Claude Code's login is a terminal program, and on a Mac what it
      # writes is a keychain entry no container can read — so the one form of
      # that credential a container can be handed is a long-lived token from
      # `claude setup-token`, run on the machine that has the keychain. Passed
      # through from the environment and never written here: a subscription
      # token in a tracked file is the state this boundary exists to end
      # (tests/compose.test.js). Empty is the ordinary state — Codex needs none
      # of this.
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      # Start order matters more than usual: a brain that boots first disables
      # chat memory until its next restart.
      - chroma
    volumes:
      # Same reason as the board above: run the working tree, not the copy baked
      # in at build time. Only src/ — the image's virtualenv lives at /app/.venv,
      # and mounting the host's brain/ over /app would swap a Linux venv for the
      # host's macOS one and the service would not start. uv installs the project
      # editable, so lodestar_brain resolves to this mount. Python has no reload
      # here, so a change needs `docker compose restart brain`, not a rebuild.
      - ./brain/src:/app/src:ro
      # The embedding model's cache, kept on the host. Without it the ~2.2 GB of
      # heydariAI/persian-embeddings lands in the container's own writable layer
      # and a recreate throws it away, so the boot download above is paid again
      # for nothing. Measured 2026-09-08: with this mount over a host cache that
      # already held the model, /health answered 200 in 18 s.
      #
      # Read-write, and that is the point rather than an oversight. `:ro` was
      # verified to work when the model is ALREADY cached — but on a machine
      # with no cache a read-only mount cannot persist the download, so every
      # start would re-fetch, which is the exact cost this mapping exists to pay
      # once. HF_HUB_OFFLINE is deliberately not set either: it saved 2 s of
      # those 18 and would turn a model nobody has downloaded yet into a hard
      # failure instead of a slow first run.
      #
      # It is the same directory the native brain fills (`uv run --project brain
      # --extra local-embeddings …`), which is why on a machine that has ever run
      # the brain natively the composed brain pays nothing at all — one download
      # per machine, not one per way of starting it. The container runs as root
      # and this is the user's own cache: on macOS Docker Desktop a bind mount
      # maps ownership to the host user, so container-root writes leave no
      # root-owned files behind. That is the reason sharing the cache is
      # acceptable here, and it is a property of this platform rather than
      # something measured on Linux.
      #
      # It shadows nothing the service imports: the image's virtualenv is at
      # /app/.venv and this mapping touches only /root/.cache.
      # tests/compose.test.js fails if it goes missing.
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface
      # Where the device login lands. CODEX_HOME defaults to $HOME/.codex and
      # this container runs as root, so this is the file `codex login` writes
      # and the file `codex exec` reads on every turn.
      #
      # A named volume and deliberately not a bind mount, which is the whole of
      # the security argument here. A path under this tree would put a live
      # subscription token where `npm run backup` copies files to Google Drive
      # and where git publishes them; `${HOME}/.codex` would hand the container
      # the owner's OWN login — their host config, their history, and a token
      # this container's model-driven subprocess could spend — where what is
      # wanted is a login OF ITS OWN, made from the browser and revocable on its
      # own. Docker's storage is also why it survives `up --build`: the code
      # is entered once per machine, not once per container.
      # There is deliberately no twin of this for Claude. Its credential
      # arrives as CLAUDE_CODE_OAUTH_TOKEN above and is never written here, so a
      # volume would be one declared for a path nothing in this design fills.
      - codex-home:/root/.codex
    restart: unless-stopped

  # Chat memory — the project's own Chroma, persisting to
  # databases/real/chroma-data beside the other two real databases. Derived
  # data: chunks and vectors rebuild from assistant.db, which is why the backup
  # covers the .db files and never this folder. A bind mount rather than a
  # named volume so "where is my data" has one answer. Host port 8003:
  # 8001/8002 belong to the unrelated ~/vectordb-lab stack
  # (tests/ports.test.js), and both stacks must be able to run at once.
  # `npm run chroma` starts just this service for native runs.
  chroma:
    # Pinned, not latest: a rebuild must not hand databases/real/chroma-data a
    # Chroma it was not written by. The tag says which release runs — 1.5.9,
    # which is also what `latest` resolves to today, so this pin changes nothing
    # about what starts. The digest is there because Docker Hub tags are
    # mutable: a re-pushed 1.5.9 would otherwise become different bytes with
    # nothing saying so — the same failure one level down. Update deliberately,
    # re-establishing the version from this machine and never from memory or a
    # changelog:
    #   docker buildx imagetools inspect chromadb/chroma:latest \
    #     --format '{{.Manifest.Digest}}'
    # One trap when checking a running container: `chroma --version` inside this
    # image reports 1.4.4 — the Rust crate version, which lags the release tag.
    # It is not the image version and has never been a Docker Hub tag.
    image: chromadb/chroma:1.5.9@sha256:1e0b73a187a28757c572acba508c46f48c9e8b0acaf5c20e6d95cdedce1acdf6
    ports:
      # Loopback on the host side, like every other published port here: a
      # vector store reachable from the Wi-Fi hands out the same private life
      # the board does, one chunk at a time.
      - "127.0.0.1:8003:8000"
    volumes:
      - ./databases/real/chroma-data:/data
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
    restart: unless-stopped

  # The :3001 sandbox's own Chroma — a physically separate store under
  # databases/test/, so test chunks and vectors never share files with real
  # chat memory: "delete the test data" is `rm -rf databases/test` and can
  # never touch the real store. `npm run test-brain` dials it on :8004
  # (tests/ports.test.js pins the pairing); `npm run chroma-test` starts it.
  chroma-test:
    # The same image as the real store, pinned the same way and for the same
    # reason: a twin on another version rehearses nothing.
    image: chromadb/chroma:1.5.9@sha256:1e0b73a187a28757c572acba508c46f48c9e8b0acaf5c20e6d95cdedce1acdf6
    ports:
      - "127.0.0.1:8004:8000"
    volumes:
      - ./databases/test/chroma-data-3001:/data
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
    restart: unless-stopped

# Docker's own storage, for the two credentials the brain earns rather than is
# given. Declared here and mounted above; nothing else in this stack uses a
# named volume, because everything else is data the owner must be able to find
# in `databases/` — and a credential is the one thing that must NOT be there.
volumes:
  codex-home:
