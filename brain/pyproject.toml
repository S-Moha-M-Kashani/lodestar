[project]
name = "lodestar-brain"
version = "0.1.0"
description = "Lodestar brain — agent, tools, and Leiden GraphRAG service"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "numpy>=2.0",
  "igraph>=0.11",
  "leidenalg>=0.10",
  "ddgs>=9.0",
]

[project.optional-dependencies]
semantic = ["fastembed>=0.7"]

[dependency-groups]
dev = ["pytest>=8.0", "respx>=0.22"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lodestar_brain"]

[tool.pytest.ini_options]
markers = [
    "eval: behavioral/quality evals (deterministic, offline)",
    "live: evals that call the real LLM; require OPENROUTER_API_KEY and BRAIN_EVAL_LIVE=1",
]
