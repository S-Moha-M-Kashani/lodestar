[project]
name = "lodestar-brain"
version = "0.1.0"
description = "Lodestar brain — agent, hybrid retrieval, and theme grouping"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "numpy>=2.0",
  "igraph>=0.11",
  "leidenalg>=0.10",
  "ddgs>=9.0",
  "chromadb>=1.5.9",
  "langchain>=1.0,<2.0",
  "langchain-core>=1.0,<2.0",
  "langchain-openai>=1.0,<2.0",
  # Retrieval, all of it LangChain's rather than ours. EnsembleRetriever and
  # MultiQueryRetriever live in langchain-classic: `langchain.retrievers` does
  # not exist in 1.x, and the slim `langchain` package deliberately does not
  # carry them.
  "langchain-classic>=1.0,<2.0",
  "langchain-chroma>=1.0,<2.0",
  "langchain-text-splitters>=1.0,<2.0",
  # BM25 is pure Python, tiny, and needs no extras, so the sparse half of hybrid
  # retrieval works in the offline suite — which is what lets those tests assert
  # on ranking at all. Deliberately *not* langchain-community's BM25Retriever:
  # that package emits a sunset DeprecationWarning on import and is no longer
  # maintained, and it is itself a thin wrapper over this. Ours is a
  # langchain_core BaseRetriever, so EnsembleRetriever cannot tell the
  # difference.
  "rank-bm25>=0.2.2",
]

[project.optional-dependencies]
semantic = ["fastembed>=0.7"]
# The RAG lab reaches embedding models fastembed does not serve — Qwen3 and the
# Persian-tuned encoders, which are plain HuggingFace checkpoints. torch is a
# ~1 GB install, so this stays an extra: without it every such model reports NA
# in the panel instead of the lab failing to start.
local-embeddings = ["sentence-transformers>=3.0"]
# Local, offline dictation with NVIDIA Parakeet TDT. mlx is Apple-Silicon only,
# so the marker keeps `uv sync --extra voice` harmless on Linux and in Docker —
# the transcriber seam falls back to OpenRouter wherever this is absent.
voice = [
  "parakeet-mlx>=0.5.2; sys_platform == 'darwin' and platform_machine == 'arm64'",
  # parakeet-mlx pulls librosa -> numba. Left to itself uv resolves numba 0.53,
  # whose llvmlite 0.36 refuses to build on anything past Python 3.9, so the
  # install fails outright. This floor keeps it on a numba with 3.13 wheels;
  # that numba is also what pins numpy below 2.5 in this environment.
  "numba>=0.62; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[dependency-groups]
dev = ["pytest>=8.0", "respx>=0.22"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lodestar_brain"]

[tool.pytest.ini_options]
markers = [
    "eval: behavioral/quality evals (deterministic, offline)",
    "live: evals that call the real LLM; require OPENROUTER_API_KEY and BRAIN_EVAL_LIVE=1",
]
