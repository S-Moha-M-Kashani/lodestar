<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lodestar RAG Lab — Inspector</title>
  <link rel="stylesheet" href="/inspector.css">
</head>
<body>
  <header class="inspector-header">
    <h1>RAG Lab &middot; Inspector</h1>
    <!-- The lab is another process and may not be running; say which, and stop
         the reader wondering whether an empty view means "nothing ran" or
         "nothing is listening". -->
    <span class="follow-state" id="follow-state">looking for the lab&hellip;</span>
    <nav class="inspector-tabs">
      <button class="inspector-tab" id="tab-groundtruth" data-view="groundtruth">Ground truth</button>
      <button class="inspector-tab" id="tab-chunks" data-view="chunks" data-step="index">Chunks</button>
      <button class="inspector-tab" id="tab-retrieval" data-view="retrieval" data-step="retrieval">Retrieval</button>
      <button class="inspector-tab" id="tab-generation" data-view="generation" data-step="generation">Generation</button>
    </nav>
  </header>

  <main>
    <section id="view-groundtruth" class="inspector-view"></section>

    <section id="view-chunks" class="inspector-view" hidden>
      <div class="inspector-active-config" id="chunks-active-config"></div>
      <div class="inspector-controls">
        <button id="build-chunks">Build index &amp; list chunks</button>
        <span id="chunks-status"></span>
      </div>
      <div id="chunks-body"></div>
    </section>

    <section id="view-retrieval" class="inspector-view" hidden>
      <div class="inspector-active-config" id="retrieval-active-config"></div>
      <div class="inspector-controls">
        <label>Question <select id="retrieval-question"></select></label>
        <button id="run-trace">Run retrieval</button>
        <span id="retrieval-status"></span>
      </div>
      <!-- One table per question of the experiment the lab last ran, and only
           those questions. Every table is a clone of the template below, so the
           columns are written once. It carries its own config line: the set and
           the single ad-hoc question below can come from different runs, and one
           line describing two pipelines would be a lie. -->
      <div class="inspector-active-config" id="retrieval-set-config"></div>
      <div id="retrieval-questions"></div>
      <!-- The single-question table, for the manual "Run retrieval" above. -->
      <div id="retrieval-body"></div>
      <div class="inspector-answer" id="retrieval-answer" data-step="generation" dir="rtl"></div>

      <template id="retrieval-table-template">
        <table class="retrieval-table">
          <thead>
            <tr>
              <th>chunk</th>
              <!-- The path column is the three ranks drawn as a shape; the same
                   three numbers follow it, so nothing lives only in the picture. -->
              <th data-step="retrieval">path</th>
              <th data-step="retrieval">dense</th>
              <th data-step="retrieval">bm25</th>
              <th data-step="retrieval">RRF</th>
              <th data-step="retrieval">rerank</th>
              <th data-step="generation">grade</th>
              <th>kept</th>
              <th>gold</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </template>
    </section>

    <!-- Generation: everything the retrieval tab shows, plus the answer the
         fixture says is right, the answer the experiment actually wrote, and
         the scores for it — each score with the '!' that explains it. Only an
         evaluation generates, so this view follows the last one of those. -->
    <section id="view-generation" class="inspector-view" hidden>
      <div class="inspector-active-config" id="generation-active-config"></div>
      <div id="generation-ragas"></div>
      <div id="generation-questions"></div>
    </section>
  </main>
  <script src="/inspector.js"></script>
</body>
</html>
