name: Bug report
description: Something behaves differently from what the documentation says.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time. Two things before you type:

        **Never paste real board or chat content.** An issue is public and this
        app holds a private life. Reproduce on a throwaway board, or describe
        the card rather than quoting it.

        **Anything security-related goes to email instead** —
        s.moha.m.kashani@gmail.com. See [`SECURITY.md`](../blob/master/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: How to reproduce it
      placeholder: |
        1. Start the board with `npm start`
        2. …
        3. …
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: The version in `package.json`, or the commit you are on.
      placeholder: "v1.7.6"
    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: Which part
      options:
        - The board (browser)
        - The board server (:3000)
        - The Assistant / the brain (:9000)
        - Setup, Docker or the tests
        - Not sure
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Your setup
      description: >
        Operating system, `node --version`, and how you are running it — native
        or Docker. For an Assistant problem, the values of `BRAIN_LLM` and
        `BRAIN_EMBEDDER`, never the keys themselves.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Anything the terminal or the browser console said
      description: Pasted here as text. Check it for keys and card text first.
      render: shell
