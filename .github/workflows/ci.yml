name: CI

# Every button and flow is exercised end-to-end before anything ships.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      # The whole history and every tag, not the single commit checkout takes
      # by default: tests/hygiene.test.js scans master and every `v*` tag
      # reachable from it for private data, and a runner given one commit and
      # no tags has nothing to scan — which is how that check was red on every
      # push without anything being wrong with the release set.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # node:sqlite needs >=23.4; matches the Dockerfile's node:24
          node-version: "24"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      # `pg` is the one npm dependency (server.js has none; the SQLite →
      # Postgres migration script imports it). tests/migrate.test.js imports it
      # lazily, so this is what tells a missing tool apart from a broken
      # migration.
      - name: Install the one npm dependency
        run: npm ci --prefer-offline --no-audit --fund=false

      # First, because it is the cheapest suite here and the one most likely to
      # catch a break: seconds against Playwright's minutes. The Postgres cases
      # in tests/postgres.test.js skip on a runner with no shared server, which
      # is the intended behaviour, not a gap — the schema itself is still
      # asserted against server.js on every run.
      - name: Server unit tests
        run: node --test tests/*.test.js

      - name: Brain unit tests (offline — fake LLM, hash embedder)
        run: uv run --project brain pytest brain/tests -v

      - name: Install Playwright's Chromium
        run: uv run --with playwright playwright install --with-deps chromium

      - name: Run the end-to-end suite (starts the server and the brain itself)
        run: uv run --with playwright python tests/e2e_test.py
